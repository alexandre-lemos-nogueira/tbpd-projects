const { Fragment, useState, useEffect, useRef } = React;

/* ── Icon helper ── */
const MSO = ({
  icon, size = 20, fill = 0, wght = 400, style, className,
}) => (
  <span
    className={`material-symbols-outlined${className ? ` ${className}` : ''}`}
    style={{ fontSize: size, width: size, height: size, fontVariationSettings: `'FILL' ${fill},'wght' ${wght},'GRAD' 0,'opsz' ${size}`, ...style }}
  >{icon}</span>
)

/* ── Base students (5 rows) ── */
const BASE_STUDENTS = [
  { id: 1, name: 'Natasha Abe Higa', email: 'natasha.higa@teachable.com', optOut: false, lastLogin: '7 minutes ago', joined: 'a year ago', purchases: '$2.01', initials: 'P', avatarGreen: true },
  { id: 2, name: 'Natasha Higa', email: 'natasha.higa@gmail.com', optOut: true, lastLogin: 'a month ago', joined: '2 months ago', purchases: '$0.00' },
  { id: 3, name: 'rodrigo', email: 'ropago@gmail.com', optOut: false, lastLogin: '—', joined: '9 months ago', purchases: '$0.00' },
]
/* After upload: new (over-limit) rows first so "first 5 lines" = pending review */
const NEW_STUDENTS = BASE_STUDENTS.map(s => ({ ...s, id: s.id + 100 }))
const UPLOADED_STUDENTS = [...NEW_STUDENTS, ...BASE_STUDENTS]
const PENDING_IDS = new Set(NEW_STUDENTS.map(s => s.id))

const STEP_SUBTITLES = [
  'Review and agree to the upload terms before proceeding.',
  'Set up Teachable Payments to enable payouts from student transactions.',
  'Choose how to handle the additional students beyond your plan limit.',
]
const NEXT_LABELS = ['Agree & Continue', 'Save & Continue', 'Confirm & Add Students']


function App() {
  /* page state */
  const [uploaded, setUploaded] = useState(false)
  const [confirmed, setConfirmed] = useState(false)
  const students = (uploaded || confirmed) ? UPLOADED_STUDENTS : BASE_STUDENTS
  const SEAT_LIMIT = confirmed ? 10 : 5
  const overLimit = (uploaded && !confirmed) ? students.length - SEAT_LIMIT : 0

  /* upload modal */
  const [uploadOpen, setUploadOpen] = useState(false)
  const [uploadTab, setUploadTab] = useState('manually')
  const [studentRows, setStudentRows] = useState([{ id: 1, name: '', email: '', password: '' }])
  const [enroll, setEnroll] = useState(false)
  const [consent, setConsent] = useState(false)
  const [payMethod, setPayMethod] = useState('')
  const [payCountry, setPayCountry] = useState('')
  const COUNTRY_ELIGIBILITY = {
    'Argentina':'Removed','Armenia':'Removed','Australia':'Available','Austria':'Available',
    'Belgium':'Available','Bolivia':'Removed','Bosnia & Herzegovina':'Removed','Bulgaria':'Available',
    'Cambodia':'Removed','Canada':'Available','Chile':'Removed','Colombia':'Removed',
    'Costa Rica':'Removed',"Côte d'Ivoire":'Removed','Croatia':'Available','Cyprus':'Available',
    'Czech Republic':'Available','Denmark':'Available','Dominican Republic':'Removed','Egypt':'Removed',
    'El Salvador':'Removed','Estonia':'Available','Finland':'Available','France':'Available',
    'Gambia':'Removed','Germany':'Available','Gibraltar':'Available','Greece':'Available',
    'Hong Kong':'Available','Hungary':'Available','Iceland':'Removed','India':'Removed',
    'Indonesia':'Removed','Ireland':'Available','Israel':'Removed','Italy':'Available',
    'Japan':'Available','Jordan':'Removed','Kenya':'Removed','Latvia':'Available',
    'Liechtenstein':'Available','Lithuania':'Available','Luxembourg':'Available',
    'Macao SAR China':'Removed','Malaysia':'Removed','Malta':'Available','Mauritius':'Removed',
    'Mexico':'Available','Morocco':'Removed','Namibia':'Removed','Netherlands':'Available',
    'New Zealand':'Available','Norway':'Available','Panama':'Removed','Paraguay':'Removed',
    'Peru':'Removed','Philippines':'Removed','Poland':'Available','Portugal':'Available',
    'Qatar':'Removed','Romania':'Available','Saudi Arabia':'Removed','Senegal':'Removed',
    'Serbia':'Removed','Singapore':'Available','Slovakia':'Available','Slovenia':'Available',
    'South Africa':'Removed','South Korea':'Removed','Spain':'Available','Sweden':'Available',
    'Switzerland':'Available','Thailand':'Removed','Trinidad & Tobago':'Removed','Tunisia':'Removed',
    'Turkey':'Removed','United Arab Emirates':'Available','United Kingdom':'Available',
    'United States':'Available','Uruguay':'Removed','Vietnam':'Removed',
  }
  const [csvDrag, setCsvDrag] = useState(false)
  const [csvFile, setCsvFile] = useState(null)

  /* simulate near-limit state */
  const [nearLimit, setNearLimit] = useState(false)

  /* drawer */
  const [drawerOpen, setDrawerOpen] = useState(false)
  const [enabledSteps, setEnabledSteps] = useState({ terms: true, payments: true, seats: true })
  const [drawerError, setDrawerError] = useState(false)

  function toggleDrawerStep(key) {
    const next = { ...enabledSteps, [key]: !enabledSteps[key] }
    if (!next.terms && !next.payments && !next.seats) { setDrawerError(true); return }
    setDrawerError(false)
    setEnabledSteps(next)
    // Keep the modal on the same step key after the active steps list changes
    const currentKey = activeSteps[step - 1]?.key
    if (currentKey) {
      const nextActiveSteps = STEP_META.filter(s => next[s.key])
      const newIdx = nextActiveSteps.findIndex(s => s.key === currentKey)
      setStep(newIdx >= 0 ? newIdx + 1 : 1)
    }
  }

  /* dynamic step list derived from enabled checkboxes */
  const STEP_META = [
    { key: 'terms',    label: 'Terms & Conditions'  },
    { key: 'payments', label: 'Teachable Payments'  },
    { key: 'seats',    label: 'Seat Options'         },
  ]
  const activeSteps = STEP_META.filter(s => enabledSteps[s.key])
  const totalSteps  = activeSteps.length

  /* 3-step setup modal */
  const [setupOpen, setSetupOpen] = useState(false)
  const [seatOnlyModal, setSeatOnlyModal] = useState(false)
  const [step, setStep] = useState(1)
  const [termsPrivacy, setTermsPrivacy] = useState(false)
  const [billing, setBilling] = useState('annually')
  const [step3Mode, setStep3Mode] = useState('upgrade')

  const currentStepKey = seatOnlyModal ? 'seats' : activeSteps[step - 1]?.key
  const allTerms = termsPrivacy
  const nextDisabled = (currentStepKey === 'terms' && !allTerms) || (currentStepKey === 'payments' && !payCountry)

  /* tooltip for warning icon */
  const [tooltipId, setTooltipId] = useState(null)

  /* misc */
  const [selected, setSelected] = useState(new Set([1]))
  const [toast, setToast] = useState(null)
  const uploadOverlayRef = useRef(null)
  const setupOverlayRef = useRef(null)

  /* ── Upload modal ── */
  function openUpload() {
    setUploadOpen(true)
    setUploadTab('manually')
    setStudentRows([{ id: 1, name: '', email: '', password: '' }])
    setEnroll(false); setConsent(false); setPayMethod(''); setCsvFile(null)
  }
  function closeUpload() { setUploadOpen(false) }

  function addRow() { setStudentRows(r => [...r, { id: Date.now(), name: '', email: '', password: '' }]) }
  function updateRow(id, field, val) {
    setStudentRows(r => r.map(row => row.id === id ? { ...row, [field]: val } : row))
  }
  function removeRow(id) { setStudentRows(r => r.filter(row => row.id !== id)) }

  function handleImport() {
    closeUpload()
    setUploaded(true)
    setToast('Upload successful!')
  }

  /* ── 3-step modal ── */
  function openSetup() {
    setSetupOpen(true)
    setStep(1)
    setTermsPrivacy(false); setPayCountry('')
    setBilling('annually'); setStep3Mode('upgrade')
  }
  function closeSetup() { setSetupOpen(false); setSeatOnlyModal(false) }

  function handleNext() {
    if (step < totalSteps) { setStep(step + 1) }
    else { closeSetup(); setConfirmed(true); setUploaded(false); setToast('Students added successfully!') }
  }
  function handleBack() { if (step > 1) setStep(step - 1) }

  function dotClass(i) {
    if (i < step) return 'step-dot-complete'
    if (i === step) return 'step-dot-active'
    return 'step-dot-inactive'
  }
  function labelClass(i) {
    if (i < step) return 'step-label-complete'
    if (i === step) return 'step-label-active'
    return 'step-label-inactive'
  }

  /* CTA label per step key */
  const ctaLabel = {
    terms: 'Agree & Continue',
    payments: 'Continue to Stripe onboarding',
    seats: 'Confirm & Add Students',
  }

  /* ── Table ── */
  const allSelected = selected.size === students.length
  function toggleAll(checked) { setSelected(checked ? new Set(students.map(s => s.id)) : new Set()) }
  function toggleOne(id) {
    const n = new Set(selected); if (n.has(id)) n.delete(id); else n.add(id); setSelected(n)
  }

  /* ── Keyboard / toast ── */
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { if (setupOpen) closeSetup(); else if (uploadOpen) closeUpload() }
    }
    document.addEventListener('keydown', onKey)
    return () => document.removeEventListener('keydown', onKey)
  }, [uploadOpen, setupOpen])

  useEffect(() => {
    if (toast) { const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t) }
  }, [toast])

  const displayCount = nearLimit && !uploaded && !confirmed ? 4 : students.length
  const counterLabel = `${displayCount}/${SEAT_LIMIT} Students`
  const fillPct = nearLimit && !uploaded && !confirmed ? 80 : Math.min((students.length / SEAT_LIMIT) * 100, 100)

  return (
    <>
      <style>{`
        /* ── App shell ── */
        .app { display:flex; min-height:100vh; }
        .nav { width:236px; flex-shrink:0; background:var(--obsidian); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; z-index:2; }
        .nav-school { padding:20px 24px; border-bottom:1px solid var(--grey-90); }
        .nav-school-name { color:var(--white); font-size:18px; font-weight:600; line-height:1.25; }
        .nav-body { flex:1; display:flex; min-height:0; overflow:hidden; }

        .rail-item { width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--grey-40); border-radius:var(--radius-lg); }
        .rail-item:hover { color:var(--white); }
        .rail-item.active { color:var(--white); }
        .rail-item.whatsnew { margin-top:auto; }
        .nav-sub { flex:1; padding:24px; overflow-y:auto; }
        .nav-sub-header { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--grey-40); margin-bottom:12px; }
        .nav-sub-item { display:block; padding:8px 0; font-size:16px; color:var(--grey-20); text-decoration:none; cursor:pointer; }
        .nav-sub-item:hover { color:var(--white); }
        .nav-sub-item.active { color:var(--white); text-decoration:underline; text-underline-offset:4px; }
        .nav-user { border-top:1px solid var(--grey-90); display:flex; align-items:stretch; flex-shrink:0; }
        .nav-user-name { flex:1; padding:16px 24px; color:var(--white); font-size:16px; }
        .nav-user-menu { width:48px; border:none; border-left:1px solid var(--grey-90); background:none; display:flex; align-items:center; justify-content:center; color:var(--grey-40); cursor:pointer; }
        .main { flex:1; min-width:0; }
        .page { max-width:1040px; margin:0 auto; padding:40px 32px 72px; }

        /* ── Page header ── */
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:16px; }
        .page-title { font-size:32px; font-weight:600; line-height:1.25; }
        .page-header-actions { display:flex; gap:8px; flex-shrink:0; }

        /* ── Buttons ── */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; font-family:var(--font-ui); font-size:14px; font-weight:600; border-radius:var(--radius-md); cursor:pointer; border:1px solid var(--obsidian); transition:background 0.15s,color 0.15s; white-space:nowrap; }

        .btn-secondary:hover { background:var(--grey-6); }

        .btn-tertiary:hover { background:#F2F2F2; border-color:#F2F2F2; }
        .btn-tertiary:active { background:#F2F2F2; border-color:#222222; }

        /* ── Student counter bar ── */
        .counter-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--white); border:1px solid var(--grey-12); border-radius:var(--radius-sm); margin-bottom:16px; }

                      ? { backgroundColor: '#E7FF33', color: '#222222', border: '1px solid #222222' }

            {/* ── Student counter bar ── */}

              className="counter-bar"
              style={uploaded && !confirmed ? { backgroundColor: '#fff7dc', border: '1px solid #f8c821' } : undefined}

              <div className="counter-left">
                {uploaded && !confirmed && (
                  <div className="counter-alert">
                    <MSO icon="warning" size={18} fill={1} style={{ color: '#f8c821' }} />

                <span className={`counter-count${uploaded && !confirmed ? ' over' : ''}`}>
                  {counterLabel}
                </span>
                <div className="counter-track">
                <div
                  className={`counter-fill${uploaded && !confirmed ? ' over' : ''}`}
                  style={{ width: `${fillPct}%` }}
                />
                </div>
                {nearLimit && !uploaded && !confirmed && (
                  <span className="counter-near-msg">You are almost out of seats in your plan.</span>

                {uploaded && !confirmed && (
                  <span className="counter-msg">

                  </span>

              </div>
              {uploaded && !confirmed && (
                <button type="button" className="counter-manage-link" onClick={openSetup}>

              {nearLimit && !uploaded && !confirmed && (
                <div className="counter-near-limit">

              <div className="filter-search">
                <MSO icon="search" size={18} />
                <input type="text" placeholder="Search for a user by name or email" />
              </div>
              <button className="filter-saved" type="button">
                Saved Filters<MSO icon="expand_more" size={16} />
              </button>
            </div>

            {/* Students table */}
            <div className="students-count">

            </div>
            <div className="table-wrap">

                <thead>
                  <tr>
                    <th><input type="checkbox" checked={allSelected} onChange={e => toggleAll(e.target.checked)} aria-label="Select all" /></th>

                    <th style={{width:'90px'}}>Last login</th><th style={{width:'90px'}}>Joined</th><th style={{width:'80px'}}>Purchases</th><th></th>
                  </tr>
                </thead>
                <tbody>
                  {students.map(s => {
                    const isPending = uploaded && !confirmed && PENDING_IDS.has(s.id)
                    return (
                    <tr key={s.id} className={isPending ? 'pending-row' : ''}>
                      <td><input type="checkbox" checked={selected.has(s.id)} onChange={() => toggleOne(s.id)} aria-label={`Select ${s.name}`} /></td>
                      <td>

                            <div className="avatar"></div>
                            {isPending && (
                              <div
                                className="warn-icon-wrap avatar-exclaim"
                                onMouseEnter={() => setTooltipId(s.id)}
                                onMouseLeave={() => setTooltipId(null)}
                              >
                                <div className="exclaim-badge">
                                  <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 0.8V4.8" stroke="white" strokeWidth="1.44" strokeLinecap="round"/>
                                    <path d="M4 7.52C4.39765 7.52 4.72 7.19765 4.72 6.8C4.72 6.40235 4.39765 6.08 4 6.08C3.60236 6.08 3.28 6.40235 3.28 6.8C3.28 7.19765 3.60236 7.52 4 7.52Z" fill="white"/>
                                  </svg>
                                </div>
                                {tooltipId === s.id && (
                                  <div className="warn-tooltip">
                                    This student is not yet clear to use Teachable's platform. Take a look at Manage upload.
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                          {s.name}
                        </div>
                      </td>
                      <td>{s.email}</td>
                      <td>{s.optOut ? 'Yes' : 'No'}</td>
                      <td>
                        {isPending
                          ? <span className="status-badge validation">On validation</span>
                          : <span className="status-badge confirmed">Confirmed</span>
                        }
                      </td>
                      <td>{s.lastLogin}</td>
                      <td>{s.joined}</td>
                      <td>{s.purchases}</td>
                      <td>
                        <button className="email-action" aria-label="Email"><MSO icon="mail" size={16} /></button>
                      </td>
                    </tr>
                    )
                  })}
                </tbody>
              </table>
            </div>
          </main>
        </div>
      </div>

      {/* ══════════ UPLOAD MODAL ══════════ */}
      <div
        ref={uploadOverlayRef}
        className={`modal-overlay${uploadOpen ? ' open' : ''}`}
        role="dialog" aria-modal="true" aria-labelledby="uploadTitle"
        onClick={e => { if (e.target === uploadOverlayRef.current) closeUpload() }}
      >
        <div className="modal">
          <div className="modal-header">
            <h2 className="modal-title" id="uploadTitle">Add Students</h2>
            <button className="modal-close" type="button" onClick={closeUpload} aria-label="Close">
              <MSO icon="close" />
            </button>
          </div>

          <div className="upload-tabs">
            <button className={`upload-tab${uploadTab === 'manually' ? ' active' : ''}`} onClick={() => setUploadTab('manually')}>Manually</button>

          </div>

          <div className="modal-body">
            {/* ── Manually ── */}
            {uploadTab === 'manually' && (
              <div>
                {studentRows.map((row, idx) => (
                  <div key={row.id} className="student-row">
                    <div className="field-group">
                      {idx === 0 && <label>Name</label>}
                      <input className="input-field" type="text" placeholder="Full name" value={row.name} onChange={e => updateRow(row.id, 'name', e.target.value)} autoComplete="off" data-gramm="false" data-gramm_editor="false" />
                    </div>
                    <div className="field-group">
                      {idx === 0 && <label>Email</label>}
                      <input className="input-field" type="email" placeholder="Email address" value={row.email} onChange={e => updateRow(row.id, 'email', e.target.value)} autoComplete="off" data-gramm="false" data-gramm_editor="false" />
                    </div>
                    <div className="field-group">
                      {idx === 0 && <label>Password (Optional)</label>}
                      <input className="input-field" type="password" placeholder="Password" value={row.password} onChange={e => updateRow(row.id, 'password', e.target.value)} autoComplete="off" data-gramm="false" data-gramm_editor="false" />
                    </div>
                    <button
                      className="row-remove"
                      style={{ marginTop: idx === 0 ? 22 : 0 }}
                      onClick={() => studentRows.length > 1 && removeRow(row.id)}
                      disabled={studentRows.length === 1}
                      aria-label="Remove row"
                    >
                      <MSO icon="close" size={16} />
                    </button>
                  </div>
                ))}
                <button className="add-another" type="button" onClick={addRow}>
                  <MSO icon="add" size={18} />Add another
                </button>
                <div className="manual-footer-checks">
                  <div className="check-row">
                    <input type="checkbox" id="enroll" checked={enroll} onChange={e => setEnroll(e.target.checked)} />
                    <label htmlFor="enroll">Enroll these students into a product</label>
                  </div>
                  <div className="check-row">
                    <input type="checkbox" id="consent" checked={consent} onChange={e => setConsent(e.target.checked)} />
                    <label htmlFor="consent">I confirm these users have consented to receiving emails from my school</label>
                  </div>
                  <div>
                    <div className="pay-method-label">
                      How did your student(s) pay you for access to your product(s)?
                      <MSO icon="info" size={16} style={{ color: 'var(--grey-40)' }} />
                    </div>
                    <select className="select-field" value={payMethod} onChange={e => setPayMethod(e.target.value)}>
                      <option value="">Select method</option>
                      <option value="stripe">Stripe</option>
                      <option value="paypal">PayPal</option>
                      <option value="bank">Bank transfer</option>
                      <option value="cash">Cash</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                </div>
              </div>
            )}

            {/* ── Import CSV ── */}
            {uploadTab === 'csv' && (
              <div>
                <div className="csv-hero">
                  <div className="csv-illustration">
                    <div className="csv-card csv-card-main">
                      <div className="csv-card-line" style={{ width: '80%' }} />
                      <div className="csv-card-line" style={{ width: '65%' }} />
                      <div className="csv-card-line" />
                    </div>
                    <div className="csv-card csv-card-over">
                      <div className="csv-card-line" style={{ width: '80%', background: '#b8ead0' }} />
                      <div className="csv-card-line" style={{ width: '65%', background: '#b8ead0' }} />
                      <div className="csv-card-line" style={{ background: '#b8ead0' }} />
                      <div className="csv-check-badge">
                        <MSO icon="check" size={12} fill={1} wght={700} style={{ color: 'var(--white)' }} />
                      </div>
                    </div>
                  </div>
                  <div className="csv-title">Bulk Import Users</div>
                  <p className="csv-desc">Bulk import a CSV of users and optionally enroll them into a course.</p>
                </div>
                <div
                  className={`csv-drop${csvDrag ? ' drag' : ''}`}
                  onDragOver={e => { e.preventDefault(); setCsvDrag(true) }}
                  onDragLeave={() => setCsvDrag(false)}
                  onDrop={e => {
                    e.preventDefault(); setCsvDrag(false)
                    const f = e.dataTransfer.files[0]; if (f) setCsvFile(f.name)
                  }}
                  onClick={() => {
                    const inp = document.createElement('input')
                    inp.type = 'file'; inp.accept = '.csv'
                    inp.onchange = () => { if (inp.files?.[0]) setCsvFile(inp.files[0].name) }
                    inp.click()
                  }}
                >
                  <MSO icon="upload_file" size={28} style={{ color: 'var(--grey-40)', marginBottom: 8 }} />
                  <div className="csv-drop-label">
                    <strong>Click to upload</strong> or drag and drop a CSV file
                  </div>
                  {csvFile && <div className="csv-file-chosen">✓ {csvFile}</div>}
                </div>
              </div>
            )}
          </div>

          <div className="modal-footer">
            <div />
            <div className="modal-footer-right">
              <button className="btn btn-secondary" type="button" onClick={closeUpload}>Cancel</button>
              <button className="btn btn-primary" type="button" onClick={handleImport}>Import</button>
            </div>
          </div>
        </div>
      </div>

      {/* ══════════ 3-STEP SETUP MODAL ══════════ */}
      <div
        ref={setupOverlayRef}
        className={`modal-overlay${setupOpen ? ' open' : ''}`}
        role="dialog" aria-modal="true" aria-labelledby="setupTitle"
        onClick={e => { if (e.target === setupOverlayRef.current) closeSetup() }}
      >
        <div className="modal">
          <div className="modal-header">
            <div>
              <h2 className="modal-title" id="setupTitle">Add Students</h2>
              <p className="modal-subtitle">{
                currentStepKey === 'terms'    ? 'Review and agree to the upload terms before proceeding.' :
                currentStepKey === 'payments' ? 'Set up Teachable Payments to enable payouts from student transactions.' :
                'Choose how to handle the additional students beyond your plan limit.'

            </div>
            <button className="modal-close" type="button" onClick={closeSetup} aria-label="Close"><MSO icon="close" /></button>
          </div>

          {/* Step indicator — dynamic */}
          {!seatOnlyModal && totalSteps > 1 && <div className="step-indicator">
            {activeSteps.map((s, idx) => {
              const i = idx + 1
              return (
                <Fragment key={s.key}>
                  <div className="step-item">
                    <div className={`step-dot ${dotClass(i)}`}>
                      {i < step ? <MSO icon="check" size={14} wght={600} fill={1} /> : i}
                    </div>
                    <span className={`step-label ${labelClass(i)}`}>{s.label}</span>
                  </div>
                  {i < totalSteps && <div className={`step-line${step > i ? ' complete' : ''}`} />}
                </Fragment>
              )
            })}
          </div>}

          <div className="modal-body">
            {/* ── Terms ── */}
            {currentStepKey === 'terms' && (

                <div className="terms-scroll-box" tabIndex={0}>
                  <h3>1. Data Privacy &amp; Consent</h3>
                  <p>By uploading student data, you confirm that you have obtained the necessary consents from your students to share their personal information with Teachable in accordance with applicable privacy laws, including GDPR and CCPA.</p>
                  <h3>2. Acceptable Use of Student Data</h3>
                  <p>Student data uploaded to Teachable may only be used for the purpose of enrolling students in your courses and communicating with them about their learning.</p>
                  <h3>3. Anti-Spam Policy</h3>
                  <p>By importing and enrolling students, you confirm these individuals have consented to receive emails from your school. Sending unsolicited emails is a violation of Teachable's Terms of Service.</p>
                  <h3>4. Accuracy of Data</h3>
                  <p>You are responsible for ensuring the accuracy and integrity of the data you upload. Teachable is not liable for errors resulting from incorrect or incomplete student data provided by you.</p>
                  <h3>5. Compliance with Laws</h3>
                  <p>You agree to comply with all applicable laws and regulations in connection with your use of Teachable's bulk student upload feature.</p>
                </div>
                <div className="terms-checks">
                  <div className="terms-check-row">
                    <input type="checkbox" id="terms-privacy" checked={termsPrivacy} onChange={e => setTermsPrivacy(e.target.checked)} />
                    <label htmlFor="terms-privacy">I confirm I have obtained consent from these students to share their data with Teachable in compliance with applicable <a href="#" onClick={e => e.preventDefault()}>privacy laws</a> (GDPR, CCPA).</label>
                  </div>
                </div>
              </div>
            )}

            {/* ── Payments ── */}
            {currentStepKey === 'payments' && (
              <div>
                <div className="payments-hero">
                  <div className="payments-hero-text">
                    <span className="wordmark">teachable</span>
                    <p>Teachable Payments partners with Stripe for secure payments and financial services.</p>
                  </div>
                  <div className="payments-hero-graphic">
                    <MSO icon="payments" size={40} fill={1} wght={300} style={{ color: 'var(--navy)' }} />
                  </div>
                </div>
                <p style={{ fontSize: 14, color: 'var(--grey-70)', marginBottom: 20, lineHeight: 1.5 }}>
                  Select the country where your business or earnings are based and we'll redirect you to Stripe to get setup and start selling:
                </p>
                <div className="form-section">
                  <label htmlFor="pay-country" style={{ fontSize: 12, fontWeight: 600, color: 'var(--grey-70)', marginBottom: 6, display: 'block' }}>Country</label>
                  <select className="pay-select" id="pay-country" value={payCountry} onChange={e => setPayCountry(e.target.value)}>
                    <option value="">Select one</option>
                    {Object.keys(COUNTRY_ELIGIBILITY).sort().map(c => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
                {payCountry && COUNTRY_ELIGIBILITY[payCountry] === 'Removed' && (
                  <div className="pay-removed-note">
                    <MSO icon="lightbulb" size={18} fill={1} style={{ color: '#7a7a00', flexShrink: 0 }} />
                    <span>You will be redirected to Stripe to continue setting up your payment for a Custom Payment Gateway.</span>
                  </div>
                )}
                <p style={{ fontSize: 14, marginTop: 16, marginBottom: 0 }}>
                  {"Need help with this setup? "}
                  <a href="#" onClick={e => e.preventDefault()} style={{ fontWeight: 700, textDecoration: 'underline', color: 'inherit' }}>Contact our sales team</a>
                </p>
              </div>
            )}

            {/* ── Seat options ── */}
            {currentStepKey === 'seats' && (
              <div>
                <div className="s3-heading">
                  <h3>Your plan has a limit of {SEAT_LIMIT} students</h3>
                  <p style={{ color: '#222222' }}>Avoid leaving your business out of seats by choosing one of the options</p>
                  <p style={{ color: '#222222' }}>Wanna discuss your options? <a href="#" onClick={e => e.preventDefault()} style={{ textDecoration: 'underline', color: '#222222', fontWeight: 700 }}>Reach out</a> our sales team!</p>
                </div>

                {/* Mode selector */}
                <div className="mode-tabs">
                  <button
                    className={`mode-tab${step3Mode === 'upgrade' ? ' active' : ''}`}
                    onClick={() => setStep3Mode('upgrade')}
                  >
                    Upgrade plan
                  </button>
                  <button
                    className={`mode-tab${step3Mode === 'pay' ? ' active' : ''}`}
                    onClick={() => setStep3Mode('pay')}
                  >
                    Pay for extra seats
                  </button>
                </div>

                {/* ── Upgrade plan ── */}
                {step3Mode === 'upgrade' && (
                  <div>
                    <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--grey-70)', marginBottom: 10 }}>
                      Select billing frequency
                    </div>
                    <div className="billing-toggle">
                      <div className="billing-pills">
                        <button className={`billing-pill${billing === 'monthly' ? ' active' : ''}`} onClick={() => setBilling('monthly')}>
                          {billing === 'monthly' && <MSO icon="check" size={14} fill={1} />}Monthly
                        </button>
                        <button className={`billing-pill${billing === 'annually' ? ' active' : ''}`} onClick={() => setBilling('annually')}>
                          {billing === 'annually' && <MSO icon="check" size={14} fill={1} />}Annually
                        </button>
                      </div>
                    </div>

                    <div className="plan-card recommended-card">
                      <div className="plan-card-label recommended">Recommended for you</div>
                      <div className="plan-card-body">
                        <div className="plan-card-row">
                          <div className="plan-name">Growth</div>
                          <div className="plan-price">
                            {billing === 'monthly' ? '$189' : '$1,668'}
                            <span>{billing === 'monthly' ? ' /month' : ' /year'}</span>
                          </div>
                        </div>
                        <div className="plan-features">
                          <div className="plan-feature">50 published products</div>
                          <div className="plan-feature">White label website</div>
                        </div>
                      </div>
                    </div>

                    <div className="plan-card">
                      <div className="plan-card-label current">Your current plan</div>
                      <div className="plan-card-body">
                        <div className="plan-card-row">
                          <div className="plan-name">Builder</div>
                          <div className="plan-price">$89 <span>/month</span></div>
                        </div>
                        <div className="plan-features">
                          <div className="plan-feature">{SEAT_LIMIT} students</div>
                          <div className="plan-feature">5 published products</div>
                        </div>
                      </div>
                    </div>

                    <div className="upgrade-links">
                      <a href="#" onClick={e => e.preventDefault()}>View all plans details</a>
                    </div>
                    <div className="upgrade-guarantee">

                      <a href="#" onClick={e => e.preventDefault()}>30-day money-back guarantee</a>.
                    </div>
                  </div>
                )}

                {/* ── Pay for extra seats ── */}
                {step3Mode === 'pay' && (
                  <div>
                    <div className="pay-seat-card">
                      <div className="pay-seat-radio">
                        <div className="pay-seat-radio-dot" />
                      </div>
                      <div className="pay-seat-icon">
                        <MSO icon="credit_card" size={22} fill={1} style={{ color: 'var(--navy)' }} />
                      </div>
                      <div style={{ flex: 1 }}>
                        <div className="pay-seat-badge">Pay as you go</div>
                        <div className="pay-seat-title">Pay for extra seats above your limit</div>
                        <div className="pay-seat-desc">
                          Keep your current plan and pay a one-time fee for the additional student uploads. Suitable for occasional or seasonal uploads without changing your plan.
                        </div>
                        <div className="pay-seat-price">
                          <strong>$0.50 per additional student</strong>
                          <span> · {overLimit} student{overLimit !== 1 ? 's' : ''} over limit = ${(overLimit * 0.50).toFixed(2)} total.</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="modal-footer">
            {!seatOnlyModal && <span className="step-counter">Step {step} of {totalSteps}</span>}
            <div className="modal-footer-right">
              {step > 1 && !seatOnlyModal && <button className="btn btn-secondary" type="button" onClick={handleBack}>Back</button>}
              <button className="btn btn-primary" type="button" onClick={handleNext} disabled={nextDisabled} style={nextDisabled ? { backgroundColor: '#e4e4e4', color: '#a7a7a7', border: '1px solid #e4e4e4', cursor: 'not-allowed', opacity: 1 } : undefined}>
                {currentStepKey ? ctaLabel[currentStepKey] : 'Continue'}
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div className="toast">
          <MSO icon="check_circle" size={18} fill={1} style={{ color: 'var(--brand-primary)' }} />
          {toast}
        </div>
      )}

      {/* ══════════ DRAWER TOGGLE ══════════ */}
      <button
        className="drawer-toggle"
        aria-label={drawerOpen ? 'Close customizer' : 'Open customizer'}
        onClick={() => setDrawerOpen(o => !o)}
      >
        <div className="drawer-toggle-pill">
          <MSO
            icon={drawerOpen ? 'chevron_right' : 'chevron_left'}
            size={18}
            style={{ color: 'var(--obsidian)' }}
          />
        </div>
      </button>

      {/* ══════════ DRAWER ══════════ */}
      <div className={`drawer${drawerOpen ? ' open' : ''}`} aria-label="Modal customizer">
        <div className="drawer-header">
          <span className="drawer-title">Customize flow</span>
          <button className="drawer-close" onClick={() => setDrawerOpen(false)} aria-label="Close drawer">
            <MSO icon="close" size={16} />
          </button>
        </div>
        <div className="drawer-body">
          <div className="drawer-section-label">Simulate states</div>
          <div className="drawer-toggle-row">
            <span className="drawer-toggle-label">Approaching seat limit</span>
            <label className="toggle-switch">
              <input type="checkbox" checked={nearLimit} onChange={e => setNearLimit(e.target.checked)} />
              <div className="toggle-track" />
              <div className="toggle-thumb" />
            </label>
          </div>

          <div className="drawer-section-label" style={{ marginTop: '20px' }}>Steps to show</div>

          {([
            { key: 'terms',    label: 'Terms & Conditions'  },
            { key: 'payments', label: 'Teachable Payments'  },
            { key: 'seats',    label: 'Seat Options'         },
          ]).map(({ key, label }) => (
            <div
              key={key}
              className={`drawer-check-row${enabledSteps[key] ? ' checked' : ''}`}
              onClick={() => toggleDrawerStep(key)}
            >
              <input
                type="checkbox"
                checked={enabledSteps[key]}
                onChange={() => toggleDrawerStep(key)}
                onClick={e => e.stopPropagation()}
              />
              <span className="drawer-check-label">{label}</span>
              {enabledSteps[key] && <MSO icon="check_circle" size={16} fill={1} style={{ color: 'var(--success-primary)', flexShrink: 0 }} />}
            </div>
          ))}

          {drawerError && (
            <div className="drawer-error">
              <MSO icon="warning" size={15} fill={1} style={{ color: '#c0392b', flexShrink: 0 }} />
              At least one step must remain selected.
            </div>
          )}

          {/* Live preview of resulting steps */}
          <div className="drawer-step-preview">
            <div className="drawer-preview-label">Resulting flow — {totalSteps} step{totalSteps !== 1 ? 's' : ''}</div>
            <div className="drawer-preview-steps">
              {activeSteps.map((s, idx) => (
                <div key={s.key} className="drawer-preview-step">
                  <div className="drawer-preview-num">{idx + 1}</div>
                  {s.label}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </>
  )
}


// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

  </script>
</body>
</html>
